{% extends "base.html" %}
{% block title %} blogs {% endblock %}

{% block content %} 

    <h3>Blog List</h3>
    <br><br>
    
    {% for blog in blogs %}
        <p>{{blog.title}}</p>
        <p>{{blog.content}}</p>
        <p>{{blog.created_at}}</p>
        <hr>
    {% endfor %}

{% endblock %}
